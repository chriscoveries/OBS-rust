# Fork-only CI for chriscoveries/obsrust-fork. Runs ONLY on our self-hosted
# runners (claw for Linux, macdad for macOS). Never part of an upstream PR:
# it lives on the fork's default branch `ci-main` and checks out the ref to test.
# Dispatch-only on purpose: these runners are ours, so no PR-triggered event may
# run untrusted code on them (no pull_request_target).
name: Self-hosted CI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
      runner:
        description: Runner label for the gate job (claw)
        default: claw
      tier2:
        description: Run Tier 2 (C build OFF/ON, ctest, export parity; no Docker)
        type: boolean
        default: true
      tier2_runner:
        description: Runner label for Tier 2 (claw; never the Mac)
        default: claw
      merge_upstream:
        description: Test the ref merged with current obs-rust master, as upstream PR CI does
        type: boolean
        default: true
      mac:
        description: Run the macOS lane (Rust gate + release report + C build ON, ctest) on macdad
        type: boolean
        default: true
concurrency:
  # Include the runner labels, so the same SHA can run on different runners at once.
  group: ci-${{ inputs.ref }}-${{ inputs.runner || 'claw' }}-${{ inputs.tier2_runner || 'claw' }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner || 'claw' }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Merge current upstream master (what upstream PR CI tests)
        if: ${{ inputs.merge_upstream != false }}
        run: |
          git fetch --no-tags https://github.com/obs-rust/obs-studio.git master
          echo "upstream master: $(git rev-parse FETCH_HEAD)"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD \
            || { echo "::error::ref does not merge cleanly with current upstream master"; exit 1; }
      - name: Submodules (public, no token)
        run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
      - name: Toolchain
        run: |
          echo "host=$(hostname) cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          for t in soldr uvx; do command -v $t || echo "MISSING: $t"; done
      - name: Lint
        run: ./lint
      - name: Format (clang-format 22.1.3, as upstream's Format job)
        run: |
          base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || git rev-parse HEAD~1)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- \
            '*.c' '*.h' '*.cpp' '*.hpp' '*.m' '*.mm' | grep -v '^deps/' || true)
          if [ ${#files[@]} -eq 0 ]; then echo "no C-family files changed"; exit 0; fi
          printf '%s\n' "${files[@]}"
          uvx --from clang-format==22.1.3 clang-format --dry-run --Werror "${files[@]}"
      - name: Rust tiers 1-3
        if: ${{ !cancelled() }}
        run: soldr cargo test --workspace --locked
  # Tier 2 runs directly on the host, without Docker (owner, 2026-10-11).
  # claw (Debian 13) matches the old container: all tests, export parity.
  tier2:
    if: ${{ inputs.tier2 != false }}
    runs-on: [self-hosted, Linux, X64, "${{ inputs.tier2_runner || 'claw' }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # The commit this workflow runs from (ci-main in normal use), so a
          # review branch can validate its own script changes.
          ref: ${{ github.sha }}
          path: .ci-main
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Merge current upstream master (what upstream PR CI tests)
        if: ${{ inputs.merge_upstream != false }}
        run: |
          git fetch --no-tags https://github.com/obs-rust/obs-studio.git master
          echo "upstream master: $(git rev-parse FETCH_HEAD)"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD \
            || { echo "::error::ref does not merge cleanly with current upstream master"; exit 1; }
      - name: Submodules (public, no token)
        run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
      - name: Toolchain
        run: |
          echo "host=$(hostname)"
          for t in cmake ninja ccache cargo nm; do command -v $t >/dev/null || { echo "MISSING: $t"; exit 1; }; done
      - name: Rust tests, release profile, host GCC
        # The gate job runs the debug profile. Run the release profile here
        # with claw's GCC 14: it catches debug-only test
        # hooks and optimisation-dependent float differences, and GCC 14
        # rejects incompatible pointer types in the C oracles.
        # Test results are report-only until upstream's own release failures are
        # fixed (e.g. obs-graphics quat_parity mul_dst_aliases_q1).
        # Test failures stay report-only, but a build or link failure (e.g. a
        # duplicate symbol after merging master) fails the step: "could not
        # compile" means the change is broken, not upstream's baseline.
        run: |
          set -o pipefail
          CC=gcc soldr cargo test --workspace --locked --release --no-fail-fast 2>&1 | tee release.log || true
          if grep -q "error: could not compile" release.log; then
            echo "::error::release build/link failed (not a test failure)"; exit 1
          fi
      - name: Tier 2 (native, OFF/ON)
        run: .ci-main/.github/ci/tier2-native.sh "$GITHUB_WORKSPACE"
  # macOS lane: macdad is the fork's only Apple Silicon box (Metal,
  # VideoToolbox, Mac-only tracks). Single ENABLE_RUST_LIBOBS=ON config
  # (not the Linux OFF/ON matrix), ctest on cmocka, Rust gate plus a
  # report-only release pass. Dispatch-only, like every job here.
  mac:
    if: ${{ inputs.mac != false }}
    runs-on: [self-hosted, macOS, ARM64, macdad]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # The commit this workflow runs from: ci-main in normal use, or a
          # review branch before ci-main is fast-forwarded.
          ref: ${{ github.sha }}
          path: .ci-main
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Merge current upstream master (what upstream PR CI tests)
        if: ${{ inputs.merge_upstream != false }}
        run: |
          git fetch --no-tags https://github.com/obs-rust/obs-studio.git master
          echo "upstream master: $(git rev-parse FETCH_HEAD)"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD \
            || { echo "::error::ref does not merge cleanly with current upstream master"; exit 1; }
      - name: Submodules (public, no token)
        run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
      - name: Toolchain
        run: |
          echo "host=$(hostname)"
          for t in soldr cmake ninja ccache cargo; do command -v $t >/dev/null || { echo "MISSING: $t"; exit 1; }; done
      - name: macOS native (gate + C build + ctest)
        run: .ci-main/.github/ci/mac-native.sh "$GITHUB_WORKSPACE"
