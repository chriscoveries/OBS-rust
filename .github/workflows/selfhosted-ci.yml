# Fork-only CI for chriscoveries/obsrust-fork. Runs ONLY on our self-hosted
# runners (RD boxes preferred, claw as backup). Never part of an upstream PR:
# it lives on the fork's default branch `ci-main` and checks out the ref to test.
name: Self-hosted CI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
      runner:
        description: Runner label (rd = RD boxes, claw = claw, own-ci = any)
        default: rd
      tier2:
        description: Run Tier 2 (C build OFF/ON, ctest, export parity; no Docker)
        type: boolean
        default: true
      tier2_runner:
        description: Runner label for Tier 2 (claw, or rd4 as backup; never the Mac)
        default: claw
  pull_request_target:
    branches: [ci-main]
concurrency:
  # Include the runner labels, so the same SHA can run on claw and rd4 at once.
  group: ci-${{ inputs.ref || github.head_ref }}-${{ inputs.runner || 'rd' }}-${{ inputs.tier2_runner || 'claw' }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner || 'rd' }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Submodules (public, no token)
        run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
      - name: Toolchain
        run: |
          echo "host=$(hostname) cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          for t in soldr uvx; do command -v $t || echo "MISSING: $t"; done
      - name: Lint
        run: ./lint
      - name: Rust tiers 1-3
        run: soldr cargo test --workspace --locked
  # Tier 2 runs directly on the host, without Docker (owner, 2026-10-11).
  # claw (Debian 13) matches the old container: all 65 tests, export parity.
  # rd4 (Ubuntu 22.04) is the backup; it builds without PipeWire, so it
  # skips test_pipewire_reconnect.
  tier2:
    if: ${{ inputs.tier2 != false }}
    runs-on: [self-hosted, Linux, X64, "${{ inputs.tier2_runner || 'claw' }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ci-main
          path: .ci-main
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Submodules (public, no token)
        run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
      - name: Toolchain
        run: |
          echo "host=$(hostname)"
          for t in cmake ninja ccache cargo nm; do command -v $t >/dev/null || { echo "MISSING: $t"; exit 1; }; done
      - name: Rust tests, release profile, host GCC
        # The gate job runs debug tests on RD hosts with older GCC. Run the
        # release profile here with claw's GCC 14: it catches debug-only test
        # hooks and optimisation-dependent float differences, and GCC 14
        # rejects incompatible pointer types in the C oracles.
        # Report-only until upstream's own release failures are fixed (e.g.
        # obs-graphics quat_parity mul_dst_aliases_q1). Read this step's log.
        continue-on-error: true
        run: CC=gcc soldr cargo test --workspace --locked --release --no-fail-fast
      - name: Tier 2 (native, OFF/ON)
        env:
          # rd4 runs Ubuntu 22.04: GIO is too old for PipeWire, there is no
          # librist, and GCC 11 raises a maybe-uninitialized warning in
          # DecodeTEA (rtmp.c, obs-rust/obs-studio#209) that newer GCC does not.
          TIER2_EXTRA_CMAKE: ${{ inputs.tier2_runner == 'rd4' && '-DENABLE_PIPEWIRE=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF -DCMAKE_C_FLAGS=-Wno-error=maybe-uninitialized' || '' }}
        run: .ci-main/.github/ci/tier2-native.sh "$GITHUB_WORKSPACE"
