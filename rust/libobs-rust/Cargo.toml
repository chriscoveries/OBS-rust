[package]
name = "libobs-rust"
version = "0.1.0"
description = "The single Rust staticlib linked into libobs when ENABLE_RUST_LIBOBS=ON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
gio-inhibit = ["obs-util/gio-inhibit"]

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
obs-util = { path = "../obs-util" }
obs-graphics = { path = "../obs-graphics" }
obs-codec = { path = "../obs-codec" }
obs-media-io = { path = "../obs-media-io" }
