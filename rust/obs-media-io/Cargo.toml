[package]
name = "obs-media-io"
version = "0.1.0"
description = "Rust ports of libobs/media-io"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
obs-graphics = { path = "../obs-graphics" }
obs-simd = { path = "../obs-simd" }
obs-util = { path = "../obs-util" }

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
obs-simd = { path = "../obs-simd", features = ["test-support"] }
proptest = "1"
